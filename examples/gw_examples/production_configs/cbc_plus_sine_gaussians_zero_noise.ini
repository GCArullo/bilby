[analysis]
# Example configuration for a simulated injection in Gaussian noise with a zero-noise realisation.
# The file can be used to run four related studies:
#  * CBC only (toggle include_sine_gaussians=False)
#  * CBC + coherent sine-Gaussians
#  * CBC + incoherent, detector-local sine-Gaussians
#  * CBC + sine-Gaussians switched off entirely to recover the baseline CBC
#
# Switch between the coherent and incoherent options by changing the
# waveform_generator.source_model and the corresponding prior/injection
# entries (see the [waveform_generator] and [injection] sections below).
label = cbc_plus_sine_gaussians_zero_noise
outdir = outdir/cbc_plus_sine_gaussians_zero_noise
trigger_time = 1126259642.0

[data]
# Generate Gaussian noise instead of reading strain from disk.
data_source = gaussian
zero_noise = True
# Two Advanced LIGO detectors.
detectors = ["H1", "L1"]
duration = 4
post_trigger_duration = 2
psd_duration = 8
sampling_frequency = 1024
minimum_frequency = 20
maximum_frequency = 512
window = tukey
roll_off = 0.2

[waveform_generator]
# Default: coherent sine-Gaussians projected through the antenna pattern.
frequency_domain_source_model = bilby.gw.source.cbc_plus_sine_gaussians
parameter_conversion = bilby.gw.conversion.convert_to_cbc_plus_sine_gaussian_parameters
# To disable the burst contribution entirely, switch to the line below:
# frequency_domain_source_model = bilby.gw.source.lal_binary_black_hole
# To inject incoherent bursts, keep the source model as-is but use the
# detector-tagged sine-Gaussian parameters in the [injection] and [prior]
# sections.
waveform_approximant = IMRPhenomXPHM
reference_frequency = 50
minimum_frequency = 20
maximum_frequency = 512
catch_waveform_errors = True

[likelihood]
class = bilby.gw.likelihood.GravitationalWaveTransient
distance_marginalization = False
time_marginalization = False
phase_marginalization = False
jitter_time = False
calibration_model = None

[prior]
# Priors for the coherent sine-Gaussian run. Replace the sine-Gaussian
# entries with detector-tagged parameters (e.g. sine_gaussian_0_H1_hrss)
# for the incoherent study, or comment them out entirely for a CBC-only run.
mass_1 = Constraint(name='mass_1', minimum=20, maximum=60)
mass_2 = Constraint(name='mass_2', minimum=15, maximum=50)
mass_ratio = bilby.gw.prior.UniformInComponentsMassRatio(name='mass_ratio', minimum=0.25, maximum=1)
chirp_mass = bilby.gw.prior.UniformInComponentsChirpMass(name='chirp_mass', minimum=20, maximum=40)
luminosity_distance = bilby.gw.prior.UniformSourceFrame(name='luminosity_distance', minimum=200, maximum=2000, unit='Mpc')
ra = Uniform(name='ra', minimum=0, maximum=2 * np.pi, boundary='periodic')
dec = Cosine(name='dec')
theta_jn = Sine(name='theta_jn')
psi = Uniform(name='psi', minimum=0, maximum=np.pi, boundary='periodic')
phase = Uniform(name='phase', minimum=0, maximum=2 * np.pi, boundary='periodic')
a_1 = Uniform(name='a_1', minimum=0, maximum=0.99)
a_2 = Uniform(name='a_2', minimum=0, maximum=0.99)
tilt_1 = Sine(name='tilt_1')
tilt_2 = Sine(name='tilt_2')
phi_12 = Uniform(name='phi_12', minimum=0, maximum=2 * np.pi, boundary='periodic')
phi_jl = Uniform(name='phi_jl', minimum=0, maximum=2 * np.pi, boundary='periodic')
geocent_time = Uniform(name='geocent_time', minimum=trigger_time - 0.2, maximum=trigger_time + 0.2)

sine_gaussian_0_hrss = LogUniform(name='sine_gaussian_0_hrss', minimum=1e-24, maximum=1e-21)
sine_gaussian_0_Q = Uniform(name='sine_gaussian_0_Q', minimum=3, maximum=30)
sine_gaussian_0_frequency = Uniform(name='sine_gaussian_0_frequency', minimum=30, maximum=256)
sine_gaussian_0_time_offset = Uniform(name='sine_gaussian_0_time_offset', minimum=-0.05, maximum=0.05)
sine_gaussian_0_phase_offset = Uniform(name='sine_gaussian_0_phase_offset', minimum=-np.pi, maximum=np.pi, boundary='periodic')

sine_gaussian_1_hrss = LogUniform(name='sine_gaussian_1_hrss', minimum=1e-24, maximum=1e-21)
sine_gaussian_1_Q = Uniform(name='sine_gaussian_1_Q', minimum=3, maximum=30)
sine_gaussian_1_frequency = Uniform(name='sine_gaussian_1_frequency', minimum=30, maximum=256)
sine_gaussian_1_time_offset = Uniform(name='sine_gaussian_1_time_offset', minimum=-0.05, maximum=0.05)
sine_gaussian_1_phase_offset = Uniform(name='sine_gaussian_1_phase_offset', minimum=-np.pi, maximum=np.pi, boundary='periodic')

[injection]
# Injection parameters compatible with the priors above. They assume a
# coherent pair of sine-Gaussians by default. For incoherent studies,
# replace the burst entries with detector-specific keys (e.g.
# sine_gaussian_0_H1_hrss and sine_gaussian_0_L1_hrss) and keep the CBC
# parameters unchanged.
do_injection = True
waveform_approximant = IMRPhenomXPHM
parameters = {
    "mass_1": 36.0,
    "mass_2": 29.0,
    "a_1": 0.3,
    "a_2": 0.2,
    "tilt_1": 0.5,
    "tilt_2": 1.1,
    "phi_12": 1.7,
    "phi_jl": 0.3,
    "luminosity_distance": 1000.0,
    "theta_jn": 0.4,
    "psi": 2.0,
    "phase": 1.0,
    "geocent_time": trigger_time,
    "ra": 1.3,
    "dec": -1.1,
    # Coherent sine-Gaussians (comment these out for a CBC-only injection)
    "sine_gaussian_0_hrss": 1e-22,
    "sine_gaussian_0_Q": 8.0,
    "sine_gaussian_0_frequency": 70.0,
    "sine_gaussian_0_time_offset": -0.07,
    "sine_gaussian_0_phase_offset": 0.0,
    "sine_gaussian_1_hrss": 8e-23,
    "sine_gaussian_1_Q": 9.0,
    "sine_gaussian_1_frequency": 120.0,
    "sine_gaussian_1_time_offset": 0.02,
    "sine_gaussian_1_phase_offset": 0.8,
}

[sampler]
sampler = dynesty
nlive = 256
dlogz = 0.1
walks = 60
maxmcmc = 2000
print_dt = 600
checkpoint_interval = 1800
result_class = bilby.gw.result.CBCResult

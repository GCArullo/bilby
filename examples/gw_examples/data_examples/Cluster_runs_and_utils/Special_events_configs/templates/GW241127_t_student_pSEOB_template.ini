################################################################################
## Student-t run configuration
################################################################################
#
# This special-event template is consumed by submit_runs_real_data.py.
# Its signal settings reproduce the pSEOB configuration embedded in
# pSEOB_GW241127_061008_Prod0.h5 from Zenodo record 21454847.

label=__LABEL__
outdir=__OUTDIR__
webdir=__WEBDIR__
prior-file=__PRIOR_FILE__
likelihood-type=bilby.gw.likelihood.StudentTGravitationalWaveTransient
extra-likelihood-kwargs={'nu': 8.0, 'infer_nu': True, 'num_frequency_bands': __NUM_FREQUENCY_BANDS__, 'detector_dependent_noise': __DETECTOR_DEPENDENT_NOISE__}

reference-frame=H1L1
time-reference=H1

################################################################################
## Calibration arguments
################################################################################

calibration-model=CubicSpline
calibration-correction-type=None
spline-calibration-envelope-dict={'H1': '__WORKING_DIRECTORY__/calibration/H1.txt', 'L1': '__WORKING_DIRECTORY__/calibration/L1.txt', 'V1': '__WORKING_DIRECTORY__/calibration/V1.txt'}
spline-calibration-nodes=10
spline-calibration-amplitude-uncertainty-dict=None
spline-calibration-phase-uncertainty-dict=None
calibration-prior-boundary=reflective

################################################################################
## Data generation arguments
################################################################################

ignore-gwpy-data-quality-check=True
gps-tuple=None
gps-file=None
timeslide-file=None
timeslide-dict=None
trigger-time=1416723026.229858
n-simulation=0
data-dict={'H1': '__WORKING_DIRECTORY__/data/H-H1_HOFT_AR01-1416720384-4096.gwf', 'L1': '__WORKING_DIRECTORY__/data/L-L1_HOFT_AR01-1416720384-4096.gwf', 'V1': '__WORKING_DIRECTORY__/data/V-HoftAR1U02-1416722000-2000.gwf'}
data-format=None
allow-tape=True
channel-dict={'H1': 'DCS-CALIB_STRAIN_CLEAN_AR01', 'L1': 'DCS-CALIB_STRAIN_CLEAN_AR01', 'V1': 'Hrec_hoftRepro1AR_16384Hz'}
fetch-open-data-kwargs={'sample_rate': 4096}
frame-type-dict=None
data-find-url=None
data-find-urltype=osdf
gaussian-noise=False
zero-noise=False

################################################################################
## Detector arguments
################################################################################

coherence-test=False
detectors=['H1', 'L1', 'V1']
duration=8.0
generation-seed=42
psd-dict={'H1': '__WORKING_DIRECTORY__/psd/glitch_median_PSD_forLI_H1.dat', 'L1': '__WORKING_DIRECTORY__/psd/glitch_median_PSD_forLI_L1.dat', 'V1': '__WORKING_DIRECTORY__/psd/glitch_median_PSD_forLI_V1.dat'}
